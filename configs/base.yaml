# Real training run — RTX 5090 GPU server.
run_name: large

# model_name: xlm-roberta-large
model_name: google/rembert
num_labels: 3
max_length: 128  # combined premise+hypothesis p95 token length is 74 (see outputs/eda/eda_report.md)

# history_seeds: 42, 1234, 98765
seed: 42
device: cuda

data:
  subset: null  # null = full train.csv
  val_size: 0.25

extra_data:
  multinli26lang:  # 543K pairs
    enabled: true
    data_dir: /home/boorble/askash/datasets/kaggle/cmdw_data/multilingual-NLI-26lang-2mil7/data
    subsets: [mnli, wanli]  # skip anli/fever/ling — domain shift from comp test set
  xnli_hf:         # 5.63 M pairs
    enabled: true
    data_dir: /home/boorble/askash/datasets/kaggle/cmdw_data/xnli_hf
    splits: [train, validation]

training:
  epochs: 1
  batch_size: 90
  eval_batch_size: 64
  lr: 1.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  fp16: false
  bf16: true
  num_workers: 8
  logging_steps: 500
  eval_strategy: steps
  eval_steps: 1000
  save_strategy: steps
  save_steps: 1000

profiling:
  enabled: false
  profile_steps: 250

clearml:
  enabled: false
  project_name: contradictory-my-dear-watson
  task_name: null  # null = falls back to run_id

paths:
  data_dir: /home/boorble/askash/datasets/kaggle/cmdw_data/base_cmdw
  output_root: outputs
  experiments_dir: experiments
