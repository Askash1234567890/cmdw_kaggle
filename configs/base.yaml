# Real training run — RTX 5090 GPU server.
run_name: large

model_name: xlm-roberta-large
num_labels: 3
max_length: 128  # combined premise+hypothesis p95 token length is 74 (see outputs/eda/eda_report.md)

seed: 42
device: cuda

data:
  subset: null  # null = full train.csv
  val_size: 0.1

training:
  epochs: 10
  batch_size: 160
  eval_batch_size: 128
  lr: 1.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  fp16: false
  bf16: true  # 5090 (Blackwell) supports bf16 natively
  num_workers: 8
  logging_steps: 50
  eval_strategy: epoch
  save_strategy: epoch

profiling:
  enabled: false
  profile_steps: 10

clearml:
  enabled: false
  project_name: contradictory-my-dear-watson
  task_name: null  # null = falls back to run_id

paths:
  data_dir: /home/boorble/askash/datasets/kaggle/cmdw_data
  output_root: outputs
  experiments_dir: experiments
